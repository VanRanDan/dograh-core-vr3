# VR3AI Lago (dev) — self-hosted billing engine on TrueNAS 192.11.0.10 (Dockge).
# Adapted from getlago/lago official docker-compose v1.48.1.
#   - api  -> macvlan 192.11.0.39:3000  (Dograh reaches Lago here, LAN-internal)
#   - front-> macvlan 192.11.0.40:80    (admin UI: http://192.11.0.40)
#   - db/redis/worker/clock/pdf on an internal bridge (no host ports)
#   - org + API key seeded on first boot via LAGO_CREATE_ORG (.env)
volumes:
  lago_postgres_data:
  lago_redis_data:
  lago_storage_data:

x-postgres-image: &postgres-image
  image: getlago/postgres-partman:15.0-alpine
x-redis-image: &redis-image
  image: redis:7-alpine
x-backend-image: &backend-image
  image: getlago/api:v1.48.1
x-frontend-image: &frontend-image
  image: getlago/front:v1.48.1

x-lago-api-url: &lago-api-url
  "LAGO_API_URL": ${LAGO_API_URL:-http://192.11.0.39:3000}
x-lago-front-url: &lago-front-url
  "LAGO_FRONT_URL": ${LAGO_FRONT_URL:-http://192.11.0.40}

x-backend-environment: &backend-env
  "DATABASE_URL": postgresql://${POSTGRES_USER:-lago}:${POSTGRES_PASSWORD:-changeme}@${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-lago}?search_path=${POSTGRES_SCHEMA:-public}
  "REDIS_URL": redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}
  "SECRET_KEY_BASE": ${SECRET_KEY_BASE}
  "RAILS_ENV": production
  "RAILS_LOG_TO_STDOUT": "true"
  "LAGO_RSA_PRIVATE_KEY": ${LAGO_RSA_PRIVATE_KEY}
  "LAGO_SIDEKIQ_WEB": "true"
  "LAGO_ENCRYPTION_PRIMARY_KEY": ${LAGO_ENCRYPTION_PRIMARY_KEY}
  "LAGO_ENCRYPTION_DETERMINISTIC_KEY": ${LAGO_ENCRYPTION_DETERMINISTIC_KEY}
  "LAGO_ENCRYPTION_KEY_DERIVATION_SALT": ${LAGO_ENCRYPTION_KEY_DERIVATION_SALT}
  "LAGO_USE_AWS_S3": "false"
  "LAGO_PDF_URL": ${LAGO_PDF_URL:-http://pdf:3000}
  "LAGO_REDIS_CACHE_URL": redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}
  "LAGO_DISABLE_SEGMENT": "true"
  "LAGO_DISABLE_SIGNUP": ${LAGO_DISABLE_SIGNUP:-true}
  "LAGO_DISABLE_PDF_GENERATION": "false"
  "LAGO_OAUTH_PROXY_URL": https://proxy.getlago.com
  "LAGO_CREATE_ORG": ${LAGO_CREATE_ORG:-false}
  "LAGO_ORG_USER_PASSWORD": ${LAGO_ORG_USER_PASSWORD:-}
  "LAGO_ORG_USER_EMAIL": ${LAGO_ORG_USER_EMAIL:-}
  "LAGO_ORG_NAME": ${LAGO_ORG_NAME:-}
  "LAGO_ORG_API_KEY": ${LAGO_ORG_API_KEY:-}

x-frontend-environment: &frontend-env
  "API_URL": ${LAGO_API_URL:-http://192.11.0.39:3000}
  "APP_ENV": production
  "LAGO_OAUTH_PROXY_URL": https://proxy.getlago.com
  "LAGO_DISABLE_PDF_GENERATION": "false"

services:
  db:
    <<: *postgres-image
    container_name: lago-db
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lago} -d ${POSTGRES_DB:-lago} -h localhost -p ${POSTGRES_PORT:-5432}"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lago}
      POSTGRES_USER: ${POSTGRES_USER:-lago}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      PGDATA: /data/postgres
      PGPORT: ${POSTGRES_PORT:-5432}
      POSTGRES_SCHEMA: public
    volumes:
      - lago_postgres_data:/data/postgres

  redis:
    <<: *redis-image
    container_name: lago-redis
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - lago_redis_data:/data

  migrate:
    <<: *backend-image
    container_name: lago-migrate
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy
        restart: true
    command: ["./scripts/migrate.sh"]
    environment:
      <<: [*backend-env, *lago-api-url, *lago-front-url]

  api:
    <<: *backend-image
    container_name: lago-api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    command: ["./scripts/start.api.sh"]
    healthcheck:
      test: curl -f http://localhost:3000/health || exit 1
      interval: 10s
      start_period: 60s
      timeout: 30s
      start_interval: 5s
    environment:
      <<: [*backend-env, *lago-api-url, *lago-front-url]
    volumes:
      - lago_storage_data:/app/storage
    networks:
      internal: {}
      macvlan-network:
        ipv4_address: 192.11.0.39

  front:
    <<: *frontend-image
    container_name: lago-front
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
        restart: true
    environment:
      <<: [*frontend-env, *lago-api-url, *lago-front-url]
    networks:
      internal: {}
      macvlan-network:
        ipv4_address: 192.11.0.40

  api-worker:
    <<: *backend-image
    container_name: lago-worker
    restart: unless-stopped
    networks: [internal]
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    command: ["./scripts/start.worker.sh"]
    healthcheck:
      test: curl -f http://localhost:8080 || exit 1
      interval: 10s
      start_period: 60s
      timeout: 30s
      start_interval: 5s
    environment:
      <<: [*backend-env, *lago-api-url]
    volumes:
      - lago_storage_data:/app/storage

  api-clock:
    <<: *backend-image
    container_name: lago-clock
    restart: unless-stopped
    networks: [internal]
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    command: ["./scripts/start.clock.sh"]
    environment:
      <<: [*backend-env, *lago-api-url]

  pdf:
    image: getlago/lago-gotenberg:7.8.2
    container_name: lago-pdf
    restart: unless-stopped
    networks: [internal]

networks:
  internal:
    driver: bridge
  macvlan-network:
    external: true
